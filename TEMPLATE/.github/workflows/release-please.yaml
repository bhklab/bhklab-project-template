name: Release-Please

on:
    push:
        branches:
            - main

permissions:
    contents: write
    pull-requests: write
    issues: write

jobs:
    release-please:
        runs-on: ubuntu-latest

        concurrency:
            group: ${{ github.workflow }}-${{ github.ref }}

        steps:
            - uses: googleapis/release-please-action@v5.0.0
              id: release
              with:
                  release-type: simple

            - uses: actions/checkout@v7.0.1
              if: ${{ steps.release.outputs.release_created }}
              with:
                  fetch-depth: 0
